  <title>NyaySetu: AI Legal Assistant for Indian Law</title>

  <script type="application/ld+json">

    "name": "NyaySetu",

    // Correct: This must be a full, absolute URL to your logo. Ensure this file exists on your server.

    "description": "An AI-powered legal assistant for simplified guidance on Indian law.",
    "provider": {
      "@type": "Organization",
      "name": "NyaySetu"
    },
    "areaServed": {
      "@type": "Country",
      "name": "IN"
    },
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Legal Assistance Services",
      "itemListElement": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "AI Legal Chatbot"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Legal Document Analysis"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Connect with Lawyers"
          }
        }
      ]
    }
  }
  </script>

</head>

<body>
